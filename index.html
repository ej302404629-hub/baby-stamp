    // === 頭像圓形縮放移動剪裁視窗 ===
    function openAvatarCropModal(file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const VIEW_SIZE = 240;
          const CROP_RADIUS = 112;
          const OUT_SIZE = 160;
          const baseScale = Math.max((CROP_RADIUS * 2) / img.width, (CROP_RADIUS * 2) / img.height);

          let zoom = 1;
          let offsetX = 0;
          let offsetY = 0;

          openModal(`
            <h3 class="modal-title">調整寶貝頭像位置</h3>
            <p style="text-align:center; font-size:13px; color:#6b7280; margin:-8px 0 12px;">
              拖曳調整位置，滑桿或雙指縮放大小
            </p>
            <div class="crop-stage">
              <canvas id="avatar-crop-canvas" class="crop-canvas" width="${VIEW_SIZE}" height="${VIEW_SIZE}"></canvas>
              <div class="crop-zoom-row">
                <span>縮放</span>
                <input type="range" id="avatar-crop-zoom-slider" min="1" max="3.5" step="0.02" value="1" />
              </div>
            </div>
            <div class="modal-actions">
              <button class="btn btn-secondary" id="avatar-crop-cancel">取消</button>
              <button class="btn btn-primary" id="avatar-crop-save">確認上傳</button>
            </div>`);

          const canvas = document.getElementById("avatar-crop-canvas");
          const ctx = canvas.getContext("2d");
          const zoomSlider = document.getElementById("avatar-crop-zoom-slider");

          function clampOffsets() {
            const drawW = img.width * baseScale * zoom;
            const drawH = img.height * baseScale * zoom;
            const maxX = Math.max(0, (drawW - CROP_RADIUS * 2) / 2);
            const maxY = Math.max(0, (drawH - CROP_RADIUS * 2) / 2);
            offsetX = Math.max(-maxX, Math.min(maxX, offsetX));
            offsetY = Math.max(-maxY, Math.min(maxY, offsetY));
          }

          function drawPreview() {
            clampOffsets();
            const drawW = img.width * baseScale * zoom;
            const drawH = img.height * baseScale * zoom;
            const dx = VIEW_SIZE / 2 + offsetX - drawW / 2;
            const dy = VIEW_SIZE / 2 + offsetY - drawH / 2;

            ctx.clearRect(0, 0, VIEW_SIZE, VIEW_SIZE);
            ctx.drawImage(img, dx, dy, drawW, drawH);

            ctx.save();
            ctx.fillStyle = "rgba(0, 0, 0, 0.58)";
            ctx.beginPath();
            ctx.rect(0, 0, VIEW_SIZE, VIEW_SIZE);
            ctx.arc(VIEW_SIZE / 2, VIEW_SIZE / 2, CROP_RADIUS, 0, Math.PI * 2, true);
            ctx.fill("evenodd");

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(VIEW_SIZE / 2, VIEW_SIZE / 2, CROP_RADIUS, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          drawPreview();

          zoomSlider.oninput = () => {
            zoom = Number(zoomSlider.value);
            drawPreview();
          };

          let isDragging = false;
          let lastX = 0, lastY = 0;

          const onMouseMove = (e) => {
            if (!isDragging) return;
            offsetX += e.clientX - lastX;
            offsetY += e.clientY - lastY;
            lastX = e.clientX;
            lastY = e.clientY;
            drawPreview();
          };
          const onMouseUp = () => { isDragging = false; };

          canvas.addEventListener("mousedown", (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
          });
          window.addEventListener("mousemove", onMouseMove);
          window.addEventListener("mouseup", onMouseUp);
          state.activeModalCleanup = () => {
            window.removeEventListener("mousemove", onMouseMove);
            window.removeEventListener("mouseup", onMouseUp);
          };

          let pinchStartDist = 0;
          let pinchStartZoom = 1;

          canvas.addEventListener("touchstart", (e) => {
            if (e.touches.length === 1) {
              isDragging = true;
              lastX = e.touches[0].clientX;
              lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
              isDragging = false;
              const dx = e.touches[0].clientX - e.touches[1].clientX;
              const dy = e.touches[0].clientY - e.touches[1].clientY;
              pinchStartDist = Math.hypot(dx, dy);
              pinchStartZoom = zoom;
            }
          }, { passive: true });

          canvas.addEventListener("touchmove", (e) => {
            if (e.touches.length === 1 && isDragging) {
              offsetX += e.touches[0].clientX - lastX;
              offsetY += e.touches[0].clientY - lastY;
              lastX = e.touches[0].clientX;
              lastY = e.touches[0].clientY;
              drawPreview();
            } else if (e.touches.length === 2 && pinchStartDist > 0) {
              const dx = e.touches[0].clientX - e.touches[1].clientX;
              const dy = e.touches[0].clientY - e.touches[1].clientY;
              const dist = Math.hypot(dx, dy);
              zoom = Math.max(1, Math.min(3.5, pinchStartZoom * (dist / pinchStartDist)));
              zoomSlider.value = zoom.toFixed(2);
              drawPreview();
            }
          }, { passive: true });

          canvas.addEventListener("touchend", () => {
            isDragging = false;
            pinchStartDist = 0;
          });

          document.getElementById("avatar-crop-cancel").onclick = closeModal;
          document.getElementById("avatar-crop-save").onclick = async () => {
            try {
              const outCanvas = document.createElement("canvas");
              outCanvas.width = OUT_SIZE;
              outCanvas.height = OUT_SIZE;
              const outCtx = outCanvas.getContext("2d");

              const ratio = OUT_SIZE / (CROP_RADIUS * 2);
              const drawW = img.width * baseScale * zoom * ratio;
              const drawH = img.height * baseScale * zoom * ratio;
              const dx = OUT_SIZE / 2 + offsetX * ratio - drawW / 2;
              const dy = OUT_SIZE / 2 + offsetY * ratio - drawH / 2;
              outCtx.drawImage(img, dx, dy, drawW, drawH);

              const base64Img = outCanvas.toDataURL("image/webp", 0.75);
              await set(ref(db, `${ROOT_PATH}/kids/${state.currentKidId}/avatar`), base64Img);
              closeModal();
              showToast("頭貼更換成功！");
            } catch (err) {
              showToast("頭貼更換失敗，請重試");
            }
          };
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function renderTaskWall() {
      const today = getTodayStr();
      const isToday = state.viewDate === today;
      const dow = getDayOfWeek(state.viewDate);
      const isEditing = state.editMode === "task";

      document.getElementById("display-date").innerHTML =
        `${state.viewDate}${!isToday ? '<span class="readonly-tag">歷史唯讀</span>' : ""}`;
      document.getElementById("display-weekday").textContent = WEEKDAYS[dow];
      document.getElementById("btn-next-day").disabled = isToday;

      const listEl = document.getElementById("task-wall-list");
      const getTaskModeOnDate = (t, dateStr, dayOfWeek) => {
        if (t.isSingle) {
          if (t.singleDate === dateStr) return "single";
        } else {
          if ((!t.startDate || dateStr >= t.startDate) && Array.isArray(t.weekdays) && t.weekdays.includes(dayOfWeek)) {
            return "routine";
          }
        }
        if (Array.isArray(t.history)) {
          for (const h of t.history) {
            if (h.isSingle) {
              if (h.singleDate === dateStr) return "single";
            } else if ((!h.startDate || dateStr >= h.startDate) && (!h.endDate || dateStr <= h.endDate) && Array.isArray(h.weekdays) && h.weekdays.includes(dayOfWeek)) {
              return "routine";
            }
          }
        }
        return null;
      };

      const tasks = Object.values(state.dbData.tasks || {})
        .filter((t) => t.kidIds && t.kidIds.includes(state.currentKidId))
        .map((t) => ({ task: t, modeOnDate: getTaskModeOnDate(t, state.viewDate, dow) }))
        .filter((item) => item.modeOnDate !== null)
        .sort((a, b) => {
          const oa = typeof a.task.order === "number" ? a.task.order : Number.MAX_SAFE_INTEGER;
          const ob = typeof b.task.order === "number" ? b.task.order : Number.MAX_SAFE_INTEGER;
          if (oa !== ob) return oa - ob;
          return (a.task.id || "").localeCompare(b.task.id || "");
        });

      const stamps = Object.values(state.dbData.stamps || {});
      const archivedDailyCount = Number(state.dbData.archivedStats?.[state.currentKidId]?.daily?.[state.viewDate]) || 0;
      const dayStampCount = stamps.filter(
        (s) => s.kidId === state.currentKidId && s.date === state.viewDate
      ).length + archivedDailyCount;
      document.getElementById("daily-stamp-count").textContent = dayStampCount;

      if (tasks.length === 0) {
        listEl.innerHTML = `<div class="empty-hint">這一天還沒有安排任務喔！<br/>點右上角 ⚙️「添加任務」來新增吧</div>`;
        return;
      }

      listEl.innerHTML = "";
      tasks.forEach(({ task, modeOnDate }) => {
        const stampCount = Math.max(1, Number(task.stampCount) || 1);
        const taskStamps = stamps.filter(
          (s) => s.kidId === state.currentKidId && s.taskId === task.id && s.date === state.viewDate
        );
        const isEditSel = isEditing && state.editSelectedIds.has(task.id);

        const row = document.createElement("div");
        row.className = `task-item ${isEditing ? "edit-mode-item" : ""} ${isEditSel ? "edit-selected" : ""}`;
        row.dataset.taskId = task.id;
        row.innerHTML = `
          ${isEditing ? `<div class="edit-check-badge">${isEditSel ? "✓" : ""}</div>` : ""}
          ${isEditing ? `<div class="task-drag-handle" title="按住拖曳排序">☰</div>` : ""}
          <div class="task-info">
            <div class="task-title">${task.name}</div>
            <div class="task-meta">${modeOnDate === "single" ? "單次任務" : "例行任務"}${stampCount > 1 ? ` · 可得 ${stampCount} 章` : ""}${!isEditing && taskStamps.length > 0 ? " · 連點兩下可取消" : ""}</div>
          </div>`;

        attachLongPress(row, () => enterEditMode("task", task.id));
        if (isEditing) {
          row.onclick = () => {
            if (state.ignoreNextClick) return;
            toggleEditSelection(task.id);
          };
          const handle = row.querySelector(".task-drag-handle");
          if (handle) attachTaskDragSort(row, handle, listEl);
        }

        const boxesWrap = document.createElement("div");
        boxesWrap.className = "stamp-boxes-wrap";

        for (let slotIndex = 0; slotIndex < stampCount; slotIndex++) {
          const existingStamp = taskStamps.find((s) => (s.slotIndex ?? 0) === slotIndex);
          const box = document.createElement("div");
          box.className = `stamp-box ${existingStamp ? "stamped" : ""} ${!isToday || isEditing ? "readonly" : ""}`;
          if (existingStamp) {
            box.innerHTML = `<div class="stamp-anim">${renderStampGraphic(existingStamp)}</div>`;
          }
          if (isToday && !isEditing) {
            box.onclick = (e) => {
              if (state.ignoreNextClick) return;
              e.stopPropagation();
              handleStampClick(task, existingStamp, slotIndex);
            };
          }
          boxesWrap.appendChild(box);
        }

        row.appendChild(boxesWrap);
        listEl.appendChild(row);
      });
    }
    function attachTaskDragSort(row, handle, listEl) {
      let isDragging = false;
      let pointerId = null;

      const onPointerMove = (e) => {
        if (!isDragging || e.pointerId !== pointerId) return;
        e.preventDefault();

        const siblings = [...listEl.querySelectorAll(".task-item:not(.dragging)")];
        let inserted = false;
        for (const sib of siblings) {
          const rect = sib.getBoundingClientRect();
          const midY = rect.top + rect.height / 2;
          if (e.clientY < midY) {
            listEl.insertBefore(row, sib);
            inserted = true;
            break;
          }
        }
        if (!inserted) {
          listEl.appendChild(row);
        }
      };

      const finishDrag = (e) => {
        if (!isDragging || e.pointerId !== pointerId) return;
        isDragging = false;
        row.classList.remove("dragging");
        window.removeEventListener("pointermove", onPointerMove);
        window.removeEventListener("pointerup", finishDrag);
        window.removeEventListener("pointercancel", finishDrag);

        state.ignoreNextClick = true;
        setTimeout(() => { state.ignoreNextClick = false; }, 250);

        saveTaskOrderFromDOM(listEl);
      };

      handle.addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        e.preventDefault();
        isDragging = true;
        pointerId = e.pointerId;
        row.classList.add("dragging");
        if (navigator.vibrate) navigator.vibrate(20);

        window.addEventListener("pointermove", onPointerMove, { passive: false });
        window.addEventListener("pointerup", finishDrag);
        window.addEventListener("pointercancel", finishDrag);
      });

      handle.addEventListener("click", (e) => e.stopPropagation());
    }

    function saveTaskOrderFromDOM(listEl) {
      const visibleIds = [...listEl.querySelectorAll(".task-item")]
        .map((el) => el.dataset.taskId)
        .filter(Boolean);
      if (visibleIds.length === 0) return;

      const allTasks = Object.values(state.dbData.tasks || {}).sort((a, b) => {
        const oa = typeof a.order === "number" ? a.order : Number.MAX_SAFE_INTEGER;
        const ob = typeof b.order === "number" ? b.order : Number.MAX_SAFE_INTEGER;
        if (oa !== ob) return oa - ob;
        return (a.id || "").localeCompare(b.id || "");
      });

      const visibleSet = new Set(visibleIds);
      const visibleSlots = [];
      allTasks.forEach((t, idx) => {
        if (visibleSet.has(t.id)) visibleSlots.push(idx);
      });

      const newOrderList = allTasks.map((t) => t.id);
      visibleSlots.forEach((slotIdx, i) => {
        if (visibleIds[i]) newOrderList[slotIdx] = visibleIds[i];
      });

      const updates = {};
      newOrderList.forEach((taskId, idx) => {
        if (state.dbData.tasks[taskId]?.order !== idx) {
          updates[`${ROOT_PATH}/tasks/${taskId}/order`] = idx;
        }
      });

      if (Object.keys(updates).length > 0) {
        update(ref(db), updates);
        showToast("已更新任務順序");
      }
    }

    function handleStampClick(task, existingStamp, slotIndex = 0) {
      const now = Date.now();
      const tapKey = `${task.id}_${state.viewDate}_${slotIndex}`;

      if (!existingStamp) {
        const gSettings = getGuardianStampSettings(state.currentGuardianId);
        const mode = gSettings.stampMode;
        const customStampId = gSettings.selectedCustomStampId;
        const customImg = gSettings.customStampImage;
        if (mode === "custom" && !customStampId && !customImg) {
          showToast("請先到設定選擇或上傳自訂圖章");
          return;
        }
        const stampId = `${state.currentKidId}_${task.id}_${state.viewDate}_${slotIndex}`;
        const newStamp = {
          id: stampId,
          kidId: state.currentKidId,
          taskId: task.id,
          slotIndex,
          date: state.viewDate,
          guardianId: state.currentGuardianId,
          mode,
          customStampId: mode === "custom" ? (customStampId || null) : null,
          timestamp: now,
          redeemedId: null
        };
        set(ref(db, `${ROOT_PATH}/stamps/${stampId}`), {
          id: stampId,
          kidId: state.currentKidId,
          taskId: task.id,
          slotIndex,
          date: state.viewDate,
          guardianId: state.currentGuardianId,
          mode,
          customStampId: mode === "custom" ? (customStampId || null) : null,
          timestamp: now,
          redeemedId: null
        });
        showToast("蓋章成功！");
      } else {
        if (state.lastTap.key === tapKey && now - state.lastTap.time < 420) {
          if (existingStamp.redeemedId) {
            showToast("此圖章已兌換，無法直接取消");
          } else {
            remove(ref(db, `${ROOT_PATH}/stamps/${existingStamp.id}`));
            showToast("已取消圖章");
          }
          state.lastTap = { key: null, time: 0 };
        } else {
          state.lastTap = { key: tapKey, time: now };
          showToast("再點一下取消圖章");
        }
      }
    }

    function renderStampBank() {
      const today = getTodayStr();
      const allKidStamps = Object.values(state.dbData.stamps || {})
        .filter((s) => s.kidId === state.currentKidId)
        .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

      const punished = allKidStamps
        .filter((s) => Boolean(s.punishedDate))
        .sort((a, b) => (a.punishedTimestamp || a.timestamp || 0) - (b.punishedTimestamp || b.timestamp || 0));
      const available = allKidStamps.filter((s) => !s.redeemedId && !s.punishedDate);
      const redeemedCount = Object.values(state.dbData.redemptions || {})
        .filter((r) => r.kidId === state.currentKidId)
        .reduce((sum, r) => sum + (Number(r.count) || 0), 0);
      const totalAfterPunish = available.length + redeemedCount;

      document.getElementById("stat-available").textContent = available.length;
      document.getElementById("stat-redeemed").textContent = redeemedCount;
      document.getElementById("stat-total").textContent = totalAfterPunish;
      document.getElementById("stat-punished").textContent = punished.length;

      document.querySelectorAll(".bank-subtab-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.bankTab === state.bankSubTab);
      });

      const grid = document.getElementById("stamp-bank-grid");
      grid.innerHTML = "";

      if (state.bankSubTab === "my") {
        if (available.length === 0) {
          grid.innerHTML = `<div class="empty-hint">目前還沒有可兌換的圖章，快去任務牆收集吧！</div>`;
          state.selectedStampIds.clear();
          updateRedeemBar();
          return;
        }

        const validIds = new Set(available.map((s) => s.id));
        for (const id of state.selectedStampIds) {
          if (!validIds.has(id)) state.selectedStampIds.delete(id);
        }

        available.forEach((stamp) => {
          const cell = document.createElement("div");
          cell.className = `bank-stamp-cell ${state.selectedStampIds.has(stamp.id) ? "selected" : ""}`;
          cell.innerHTML = renderStampGraphic(stamp);
          cell.onclick = () => {
            if (state.selectedStampIds.has(stamp.id)) {
              state.selectedStampIds.delete(stamp.id);
            } else {
              state.selectedStampIds.add(stamp.id);
            }
            cell.classList.toggle("selected");
            updateRedeemBar();
          };
          grid.appendChild(cell);
        });
        updateRedeemBar();
      } else {
        // 處罰子頁籤
        state.selectedStampIds.clear();
        updateRedeemBar();

        if (punished.length === 0) {
          grid.innerHTML = `<div class="empty-hint">目前沒有被處罰的圖章喔！</div>`;
          if (state.editMode === "punished") exitEditMode();
          return;
        }

        const isEditingPunished = state.editMode === "punished";
        punished.forEach((stamp) => {
          const isPunishedToday = stamp.punishedDate === today;
          const isEditSel = isEditingPunished && isPunishedToday && state.editSelectedIds.has(stamp.id);

          const cell = document.createElement("div");
          cell.className = `bank-stamp-cell ${isEditSel ? "punish-edit-selected" : ""}`;
          cell.innerHTML = `
            ${renderStampGraphic(stamp)}
            <div class="punish-overlay ${isPunishedToday ? "today" : "expired"}">
              ${getCryingFaceSVG()}
            </div>
            ${isEditingPunished && isPunishedToday ? `<div class="punish-check-badge">${isEditSel ? "✓" : ""}</div>` : ""}`;

          if (isPunishedToday) {
            attachLongPress(cell, () => enterEditMode("punished", stamp.id));
            cell.onclick = () => {
              if (state.ignoreNextClick) return;
              if (isEditingPunished) {
                toggleEditSelection(stamp.id);
              }
            };
          } else {
            cell.onclick = () => {
              if (isEditingPunished) {
                showToast("已超過當日，無法恢復");
              }
            };
          }

          grid.appendChild(cell);
        });
      }
    }

    function updateRedeemBar() {
      const bar = document.getElementById("redeem-bar");
      const count = state.selectedStampIds.size;
      document.getElementById("selected-stamp-count").textContent = count;
      bar.classList.toggle("hidden", count === 0 || state.currentTab !== "bank" || state.bankSubTab !== "my");
    }

    function renderRedemptionHistory() {
      const listEl = document.getElementById("redemption-list");
      const records = Object.values(state.dbData.redemptions || {})
        .filter((r) => r.kidId === state.currentKidId)
        .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      if (records.length === 0) {
        listEl.innerHTML = `<div class="empty-hint">還沒有兌換紀錄喔！</div>`;
        return;
      }

      const todayMs = new Date(getTodayStr()).getTime();
      listEl.innerHTML = "";
      records.forEach((rec) => {
        const g = getGuardianForDisplay(rec.guardianId);
        const recMs = new Date(rec.date).getTime();
        const diffDays = (todayMs - recMs) / (1000 * 60 * 60 * 24);
        const canCancel = diffDays <= 7;

        const row = document.createElement("div");
        row.className = "redemption-item";
        row.style.backgroundColor = g.bg;
        row.style.borderLeft = `6px solid ${g.color}`;
        row.innerHTML = `
          <div class="redemption-left">
            <div class="redemption-title">${rec.itemName}</div>
            <div class="redemption-meta">使用 <strong>${rec.count}</strong> 個圖章 · 關主：${g.name}</div>
          </div>
          <div class="redemption-right">
            <span>${rec.date}</span>
          </div>`;

        if (canCancel) {
          const cancelBtn = document.createElement("button");
          cancelBtn.className = "cancel-redeem-btn";
          cancelBtn.textContent = "X";
          cancelBtn.title = "取消此筆兌換";
          cancelBtn.onclick = () => cancelRedemption(rec);
          row.querySelector(".redemption-right").appendChild(cancelBtn);
        }
        listEl.appendChild(row);
      });
    }

    function cancelRedemption(rec) {
      if (!confirm(`確定要取消「${rec.itemName}」並退回 ${rec.count} 個圖章嗎？`)) return;
      const updates = {};
      updates[`${ROOT_PATH}/redemptions/${rec.id}`] = null;
      (rec.stampIds || []).forEach((sid) => {
        updates[`${ROOT_PATH}/stamps/${sid}/redeemedId`] = null;
        updates[`${ROOT_PATH}/stamps/${sid}/redeemedDate`] = null;
        updates[`${ROOT_PATH}/stamps/${sid}/redeemExpireDate`] = null;
      });
      update(ref(db), updates);
      showToast("已取消兌換並退回圖章");
    }

    // === Modal 控制 ===
    function runModalCleanup() {
      if (typeof state.activeModalCleanup === "function") {
        state.activeModalCleanup();
        state.activeModalCleanup = null;
      }
    }
    function openModal(html) {
      runModalCleanup();
      state.customStampModalOpen = false;
      document.getElementById("modal-content").innerHTML = html;
      document.getElementById("modal-overlay").classList.remove("hidden");
    }
    function closeModal() {
      runModalCleanup();
      state.customStampModalOpen = false;
      state.customStampEditMode = false;
      state.customStampEditSelectedIds.clear();
      document.getElementById("modal-overlay").classList.add("hidden");
    }
    document.getElementById("modal-overlay").onclick = (e) => {
      if (e.target.id === "modal-overlay") closeModal();
    };

    // 等級外框全覽 Modal（支援點擊任一外框上傳替換、無限新增與恢復/刪除）
    function openLevelFramesModal() {
      const kid = getActiveKids()[state.currentKidId];
      if (!kid) return;

      const { lvl, total, threshold } = getKidLevelAndTotal(state.currentKidId);
      const customFrames = state.dbData.customFrames || {};
      const customLevels = Object.keys(customFrames).map(Number).filter((n) => !isNaN(n));
      const maxLevel = Math.max(20, ...customLevels);
      const nextLevel = maxLevel + 1;
      let uploadTargetLevel = nextLevel;

      let gridHTML = "";
      for (let i = 1; i <= maxLevel; i++) {
        const isCurrent = i === lvl;
        const hasCustom = Boolean(customFrames[i] && customFrames[i].image);
        const name = i > 20 ? (customFrames[i]?.name || "自訂外框") : (hasCustom ? "已自訂" : FRAME_LEVEL_NAMES[i - 1]);
        gridHTML += `
          <div class="frame-overview-card ${isCurrent ? 'active-current' : ''}" data-lvl="${i}" title="點擊上傳圖片替換 LVL ${i} 外框">
            ${hasCustom ? `<button type="button" class="del-custom-frame-btn" data-lvl="${i}" title="${i <= 20 ? '恢復預設外框' : '刪除此自訂外框'}" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#ef4444;color:#fff;font-size:12px;font-weight:900;cursor:pointer;z-index:5;line-height:1;">×</button>` : ""}
            <div class="frame-overview-display">
              <div class="frame-overview-display-inner">
                ${renderKidAvatarHTML(kid)}
              </div>
              <div class="avatar-frame" style="width:46px; height:46px;">${getFrameSVG(i)}</div>
            </div>
            <div class="frame-overview-title" style="${isCurrent ? 'color:#f59e0b;' : ''}">LVL ${i}</div>
            <div class="frame-overview-desc">${name}</div>
          </div>`;
      }

      // 結尾加入「＋ 新增外框」卡片（支援超過 20 級無限新增）
      gridHTML += `
        <div class="frame-overview-card" id="btn-add-custom-frame" style="border:2px dashed #9ca3af; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:84px;">
          <div style="font-size:24px; font-weight:800; color:#4b5563; line-height:1;">＋</div>
          <div class="frame-overview-title" style="margin-top:4px;">LVL ${nextLevel}</div>
          <div class="frame-overview-desc">上傳外框</div>
        </div>`;

      openModal(`
        <h3 class="modal-title">寶貝等級外框 (共 ${maxLevel} 級)</h3>
        <p style="text-align:center; font-size:13px; color:#6b7280; margin:-8px 0 4px;">
          累積總數 <strong>${total}</strong> 章 (目前為 <strong>LVL ${lvl}</strong>)
        </p>
        <p style="text-align:center; font-size:11px; color:#9ca3af; margin:0 0 14px;">
          點擊任一外框可上傳圖片替換（支援去背 PNG / WebP / GIF 動圖，GIF 限 2MB 內）
        </p>
        <input type="file" id="m-custom-frame-input" accept="image/gif,image/png,image/webp,image/*" class="hidden" />
        <div class="frames-overview-grid">
          ${gridHTML}
        </div>
        <div class="form-group" style="border-top:1px solid #e5e7eb; padding-top:14px; margin-top:14px;">
          <label class="form-label" style="display:flex; justify-content:space-between; align-items:center;">
            <span>設定多少章升一級</span>
            <span style="font-size:12px; font-weight:normal; color:#6b7280;">(修改後將重新計算等級)</span>
          </label>
          <div style="display:flex; gap:8px; align-items:center;">
            <input type="number" id="m-lvl-threshold-input" class="form-input" style="width:120px;" value="${threshold}" min="1" />
            <span style="font-size:14px; font-weight:700; color:#475569;">章 / 一級</span>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-primary" id="m-lvl-confirm">確認關閉</button>
        </div>`);

      const fileInput = document.getElementById("m-custom-frame-input");

      // 點擊各級數外框卡片開啟大圖預覽
      document.querySelectorAll(".frame-overview-card[data-lvl]").forEach((card) => {
        card.onclick = () => {
          openFramePreviewModal(Number(card.dataset.lvl));
        };
      });


      // 點擊「＋」新增下一級自訂外框
      document.getElementById("btn-add-custom-frame").onclick = () => {
        uploadTargetLevel = nextLevel;
        fileInput.value = "";
        fileInput.click();
      };

      fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const webpBase64 = await compressFrameImageFile(file);
          await set(ref(db, `${ROOT_PATH}/customFrames/${uploadTargetLevel}`), {
            level: uploadTargetLevel,
            name: uploadTargetLevel > 20 ? "自訂外框" : FRAME_LEVEL_NAMES[uploadTargetLevel - 1],
            image: webpBase64,
            timestamp: Date.now()
          });
          showToast(`已更新 LVL ${uploadTargetLevel} 外框！`);
          openLevelFramesModal();
        } catch (err) {
          showToast(err?.message || "外框上傳失敗，請重試");
        }
      };

      // 點擊右上角 × 恢復預設或刪除自訂外框
      document.querySelectorAll(".del-custom-frame-btn").forEach((btn) => {
        btn.onclick = async (e) => {
          e.stopPropagation();
          const targetLvl = Number(btn.dataset.lvl);
          const msg = targetLvl <= 20
            ? `確定要將 LVL ${targetLvl} 恢復為預設外框嗎？`
            : `確定要刪除 LVL ${targetLvl} 的自訂外框嗎？`;
          if (!confirm(msg)) return;
          await remove(ref(db, `${ROOT_PATH}/customFrames/${targetLvl}`));
          showToast(targetLvl <= 20 ? `已恢復 LVL ${targetLvl} 預設外框` : `已刪除 LVL ${targetLvl} 外框`);
          openLevelFramesModal();
        };
      });

      document.getElementById("m-lvl-confirm").onclick = () => {
        const inputVal = Number(document.getElementById("m-lvl-threshold-input").value) || 50;
        const currentThreshold = Number(state.dbData.settings?.lvlThreshold) || 50;
        if (inputVal !== currentThreshold) {
          set(ref(db, `${ROOT_PATH}/settings/lvlThreshold`), inputVal);
          showToast(`升級門檻已設定為：每 ${inputVal} 章一級`);
        }
        closeModal();
      };
    }
    // 單一等級外框大圖預覽與上傳 Modal
    function openFramePreviewModal(targetLvl) {
      const kid = getActiveKids()[state.currentKidId];
      if (!kid) return;

      const customFrames = state.dbData.customFrames || {};
      const hasCustom = Boolean(customFrames[targetLvl] && customFrames[targetLvl].image);
      const frameName = targetLvl > 20
        ? (customFrames[targetLvl]?.name || "自訂外框")
        : (hasCustom ? "已自訂外框" : FRAME_LEVEL_NAMES[targetLvl - 1]);

      openModal(`
        <h3 class="modal-title">LVL ${targetLvl} 外框預覽</h3>
        <div style="display:flex; flex-direction:column; align-items:center; margin:4px 0 16px;">
          <div style="position:relative; width:160px; height:160px; display:flex; align-items:center; justify-content:center;">
            <div style="width:100px; height:100px; border-radius:50%; overflow:hidden; background:#f3f4f6; display:flex; align-items:center; justify-content:center;">
              ${renderKidAvatarHTML(kid)}
            </div>
            <div class="avatar-frame">${getFrameSVG(targetLvl)}</div>
          </div>
          <span class="lvl-badge" style="margin-top:8px; cursor:default;">LVL ${targetLvl}</span>
          <div style="font-size:13px; color:#6b7280; margin-top:6px;">${frameName}</div>
        </div>
        <p style="text-align:center; font-size:12px; color:#9ca3af; margin:0 0 4px;">
          支援去背 PNG / WebP / GIF 動圖（GIF 限 2MB 內）
        </p>
        <input type="file" id="m-preview-frame-input" accept="image/gif,image/png,image/webp,image/*" class="hidden" />
        <div class="modal-actions">
          <button class="btn btn-secondary" id="m-preview-back">返回</button>
          <button class="btn btn-primary" id="m-preview-upload">上傳新頭框</button>
        </div>`);

      const previewFileInput = document.getElementById("m-preview-frame-input");

      document.getElementById("m-preview-back").onclick = openLevelFramesModal;
      document.getElementById("m-preview-upload").onclick = () => {
        previewFileInput.value = "";
        previewFileInput.click();
      };

      previewFileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const webpBase64 = await compressFrameImageFile(file);
          const frameData = {
            level: targetLvl,
            name: targetLvl > 20 ? "自訂外框" : FRAME_LEVEL_NAMES[targetLvl - 1],
            image: webpBase64,
            timestamp: Date.now()
          };
          await set(ref(db, `${ROOT_PATH}/customFrames/${targetLvl}`), frameData);
          if (!state.dbData.customFrames) state.dbData.customFrames = {};
          state.dbData.customFrames[targetLvl] = frameData;
          showToast(`已更新 LVL ${targetLvl} 外框！`);
          openFramePreviewModal(targetLvl);
        } catch (err) {
          showToast(err?.message || "外框上傳失敗，請重試");
        }
      };
    }

    // 新增關主 Modal
    function openAddGuardianModal() {
      let selectedAvatar = "h_boy";
      let selectedCategory = "humans";
      let selectedColor = "#3399FF";
      const webSafeColors = getWebSafeColors();

      openModal(`
        <h3 class="modal-title">新增關主身分</h3>
        <div class="guardian-preview-box" id="ng-preview-box">
          <div class="guardian-preview-avatar" id="ng-preview-avatar"></div>

            <button type="button" class="avatar-cat-btn" data-cat="animals">動物 (10)</button>
          </div>
          <div class="avatar-picker-grid" id="ng-avatar-grid"></div>
        </div>
        <div class="form-group">
          <label class="form-label">選擇專屬顏色（網路安全色票 216 色）</label>
          <div class="websafe-palette" id="ng-color-palette"></div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="m-cancel">取消</button>
          <button class="btn btn-primary" id="m-save">新增</button>
        </div>`);

      const nameInput = document.getElementById("new-guardian-name");
      const previewBox = document.getElementById("ng-preview-box");
      const previewAvatar = document.getElementById("ng-preview-avatar");
      const previewName = document.getElementById("ng-preview-name");
      const previewHex = document.getElementById("ng-preview-hex");
      const avatarGrid = document.getElementById("ng-avatar-grid");
      const colorPalette = document.getElementById("ng-color-palette");

      function updatePreview() {
        const bg = hexToSoftBg(selectedColor);
        previewBox.style.backgroundColor = bg;
        previewBox.style.border = `2px solid ${selectedColor}`;
        previewAvatar.innerHTML = getGuardianSVG({ avatarType: selectedAvatar, color: selectedColor });
        previewName.textContent = nameInput.value.trim() || "新關主";
        previewHex.textContent = selectedColor;
        previewHex.style.color = selectedColor;
      }

      function renderAvatarPicker() {
        avatarGrid.innerHTML = "";
        GUARDIAN_AVATAR_OPTIONS[selectedCategory].forEach((opt) => {
          const item = document.createElement("div");
          item.className = `avatar-pick-item ${opt.type === selectedAvatar ? "selected" : ""}`;
          item.innerHTML = `
            <div class="avatar-pick-svg">${getGuardianSVG({ avatarType: opt.type, color: selectedColor })}</div>
            <div class="avatar-pick-label">${opt.label}</div>`;
          item.onclick = () => {
            selectedAvatar = opt.type;
            renderAvatarPicker();
            updatePreview();
          };
          avatarGrid.appendChild(item);
        });
      }

      function renderColorPalette() {
        colorPalette.innerHTML = "";
        webSafeColors.forEach((hex) => {
          const swatch = document.createElement("div");
          swatch.className = `color-swatch ${hex === selectedColor ? "selected" : ""}`;
          swatch.style.backgroundColor = hex;
          swatch.title = hex;
          swatch.onclick = () => {
            selectedColor = hex;
            renderColorPalette();
            renderAvatarPicker();
            updatePreview();
          };
          colorPalette.appendChild(swatch);
        });
      }

      document.querySelectorAll(".avatar-cat-btn").forEach((btn) => {
        btn.onclick = () => {
          selectedCategory = btn.dataset.cat;
          document.querySelectorAll(".avatar-cat-btn").forEach((b) => b.classList.toggle("active", b === btn));
          renderAvatarPicker();
        };
      });

      nameInput.oninput = updatePreview;

      updatePreview();
      renderAvatarPicker();
      renderColorPalette();

      document.getElementById("m-cancel").onclick = closeModal;
      document.getElementById("m-save").onclick = () => {
        const name = nameInput.value.trim();
        if (!name) return showToast("請輸入關主稱呼");
        const id = uid("g");
        set(ref(db, `${ROOT_PATH}/guardians/${id}`), {
          id,
          name,
          color: selectedColor,
          bg: hexToSoftBg(selectedColor),
          avatarType: selectedAvatar
        });
        state.currentGuardianId = id;
        closeModal();
        showToast(`已新增關主：${name}`);
      };
    }

    // === 自訂圖章視窗 ===
    function openCustomStampsModal() {
      runModalCleanup();
      state.customStampEditMode = false;
      state.customStampEditSelectedIds.clear();
      state.customStampModalOpen = true;
      document.getElementById("modal-overlay").classList.remove("hidden");
      renderCustomStampsModalContent();
    }

    function renderCustomStampsModalContent() {
      const stampsList = Object.values(state.dbData.customStamps || {})
        .filter((item) => item && !item.hidden)
        .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
      const gSettings = getGuardianStampSettings(state.currentGuardianId);
      const selectedId = gSettings.selectedCustomStampId;
      const selectedImg = gSettings.customStampImage;
      const isEditing = state.customStampEditMode;

      const box = document.getElementById("modal-content");
      box.innerHTML = `
        <h3 class="modal-title">自訂圖章</h3>
        <p style="text-align:center; font-size:13px; color:#6b7280; margin:-8px 0 10px;">
          ${isEditing ? `編輯模式：已選取 ${state.customStampEditSelectedIds.size} 個圖章` : "點選圖章即可使用，長按圖章可進入編輯刪除"}
        </p>
        <input type="file" id="cs-upload-input" accept="image/*" class="hidden" />
        <div class="custom-stamp-grid" id="cs-grid"></div>
        <div class="modal-actions">
          ${isEditing
            ? `<button class="btn btn-secondary" id="cs-cancel-edit">取消</button>
               <button class="btn btn-danger" id="cs-delete-btn" ${state.customStampEditSelectedIds.size === 0 ? "disabled" : ""}>刪除</button>`
            : `<button class="btn btn-secondary" id="cs-back-settings">返回設定</button>
               <button class="btn btn-primary" id="cs-done">完成</button>`}
        </div>`;

      const grid = document.getElementById("cs-grid");
      const fileInput = document.getElementById("cs-upload-input");

      fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        openStampCropModal(file);
      };

      stampsList.forEach((item) => {
        const isActive = !isEditing && (item.id === selectedId || (!selectedId && selectedImg && item.image === selectedImg));
        const isEditSel = isEditing && state.customStampEditSelectedIds.has(item.id);

    // === 圓形縮放剪裁視窗 ===
    function openStampCropModal(file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const VIEW_SIZE = 240;
          const CROP_RADIUS = 112;
          const OUT_SIZE = 160;
          const baseScale = Math.max((CROP_RADIUS * 2) / img.width, (CROP_RADIUS * 2) / img.height);

          let zoom = 1;
          let offsetX = 0;
          let offsetY = 0;

          openModal(`
            <h3 class="modal-title">調整圓形圖章位置</h3>
            <p style="text-align:center; font-size:13px; color:#6b7280; margin:-8px 0 12px;">
              拖曳調整位置，滑桿或雙指縮放大小
            </p>
            <div class="crop-stage">
              <canvas id="crop-canvas" class="crop-canvas" width="${VIEW_SIZE}" height="${VIEW_SIZE}"></canvas>
              <div class="crop-zoom-row">
                <span>縮放</span>
                <input type="range" id="crop-zoom-slider" min="1" max="3.5" step="0.02" value="1" />
              </div>
            </div>
            <div class="modal-actions">
              <button class="btn btn-secondary" id="crop-cancel">取消</button>
              <button class="btn btn-primary" id="crop-save">確認儲存</button>
            </div>`);

          const canvas = document.getElementById("crop-canvas");
          const ctx = canvas.getContext("2d");
          const zoomSlider = document.getElementById("crop-zoom-slider");

          function clampOffsets() {
            const drawW = img.width * baseScale * zoom;
            const drawH = img.height * baseScale * zoom;
            const maxX = Math.max(0, (drawW - CROP_RADIUS * 2) / 2);
            const maxY = Math.max(0, (drawH - CROP_RADIUS * 2) / 2);
            offsetX = Math.max(-maxX, Math.min(maxX, offsetX));
            offsetY = Math.max(-maxY, Math.min(maxY, offsetY));
          }

          function drawPreview() {
            clampOffsets();
            const drawW = img.width * baseScale * zoom;
            const drawH = img.height * baseScale * zoom;
            const dx = VIEW_SIZE / 2 + offsetX - drawW / 2;
            const dy = VIEW_SIZE / 2 + offsetY - drawH / 2;

            ctx.clearRect(0, 0, VIEW_SIZE, VIEW_SIZE);
            ctx.drawImage(img, dx, dy, drawW, drawH);

            // 圓形外部半透明遮罩
            ctx.save();
            ctx.fillStyle = "rgba(0, 0, 0, 0.58)";
            ctx.beginPath();
            ctx.rect(0, 0, VIEW_SIZE, VIEW_SIZE);
            ctx.arc(VIEW_SIZE / 2, VIEW_SIZE / 2, CROP_RADIUS, 0, Math.PI * 2, true);
            ctx.fill("evenodd");

            // 圓形外框
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(VIEW_SIZE / 2, VIEW_SIZE / 2, CROP_RADIUS, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          drawPreview();

          zoomSlider.oninput = () => {
            zoom = Number(zoomSlider.value);
            drawPreview();
          };

          // 滑鼠拖曳
          let isDragging = false;
          let lastX = 0, lastY = 0;

          const onMouseMove = (e) => {
            if (!isDragging) return;
            offsetX += e.clientX - lastX;
            offsetY += e.clientY - lastY;
            lastX = e.clientX;
            lastY = e.clientY;
            drawPreview();
          };
          const onMouseUp = () => { isDragging = false; };

          canvas.addEventListener("mousedown", (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
          });
          window.addEventListener("mousemove", onMouseMove);
          window.addEventListener("mouseup", onMouseUp);
          state.activeModalCleanup = () => {
            window.removeEventListener("mousemove", onMouseMove);
            window.removeEventListener("mouseup", onMouseUp);
          };

          // 觸控拖曳與雙指縮放
          let pinchStartDist = 0;
          let pinchStartZoom = 1;

          canvas.addEventListener("touchstart", (e) => {
            if (e.touches.length === 1) {
              isDragging = true;
              lastX = e.touches[0].clientX;
              lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
              isDragging = false;
              const dx = e.touches[0].clientX - e.touches[1].clientX;
              const dy = e.touches[0].clientY - e.touches[1].clientY;
              pinchStartDist = Math.hypot(dx, dy);
              pinchStartZoom = zoom;
            }
          }, { passive: true });

          canvas.addEventListener("touchmove", (e) => {
            if (e.touches.length === 1 && isDragging) {
              offsetX += e.touches[0].clientX - lastX;
              offsetY += e.touches[0].clientY - lastY;
              lastX = e.touches[0].clientX;
              lastY = e.touches[0].clientY;
              drawPreview();
            } else if (e.touches.length === 2 && pinchStartDist > 0) {
              const dx = e.touches[0].clientX - e.touches[1].clientX;
              const dy = e.touches[0].clientY - e.touches[1].clientY;
              const dist = Math.hypot(dx, dy);
              zoom = Math.max(1, Math.min(3.5, pinchStartZoom * (dist / pinchStartDist)));
              zoomSlider.value = zoom.toFixed(2);
              drawPreview();
            }
          }, { passive: true });

          canvas.addEventListener("touchend", () => {
            isDragging = false;
            pinchStartDist = 0;
          });

          document.getElementById("crop-cancel").onclick = openCustomStampsModal;
          document.getElementById("crop-save").onclick = () => {
            const outCanvas = document.createElement("canvas");
            outCanvas.width = OUT_SIZE;
            outCanvas.height = OUT_SIZE;
            const outCtx = outCanvas.getContext("2d");

            // 剪裁成真正的圓形透明圖案（輸出為 WebP）
            outCtx.beginPath();
            outCtx.arc(OUT_SIZE / 2, OUT_SIZE / 2, OUT_SIZE / 2, 0, Math.PI * 2);
            outCtx.closePath();
            outCtx.clip();

            const ratio = OUT_SIZE / (CROP_RADIUS * 2);
            const drawW = img.width * baseScale * zoom * ratio;
            const drawH = img.height * baseScale * zoom * ratio;
            const dx = OUT_SIZE / 2 + offsetX * ratio - drawW / 2;
            const dy = OUT_SIZE / 2 + offsetY * ratio - drawH / 2;
            outCtx.drawImage(img, dx, dy, drawW, drawH);

            const circleBase64 = outCanvas.toDataURL("image/webp", 0.8);
            const id = uid("cs");
            const updates = {};
            updates[`${ROOT_PATH}/customStamps/${id}`] = {
              id,
              image: circleBase64,
              timestamp: Date.now()
            };
            updates[`${ROOT_PATH}/settings/guardianModes/${state.currentGuardianId}/stampMode`] = "custom";
            updates[`${ROOT_PATH}/settings/guardianModes/${state.currentGuardianId}/selectedCustomStampId`] = id;
            updates[`${ROOT_PATH}/settings/guardianModes/${state.currentGuardianId}/customStampImage`] = null;
            update(ref(db), updates);

            showToast("自訂圓形圖章新增成功！");
            openCustomStampsModal();
          };
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    document.getElementById("btn-confirm-guardian").onclick = () => {
      if (!state.coreLoaded) return showToast("寶貝資料載入中，請稍候...");
      if (Object.keys(getAllGuardians()).length === 0) return showToast("請先新增至少一位關主");
      showPage("kid");
    };
    document.getElementById("btn-back-guardian").onclick = () => showPage("guardian");
    document.getElementById("btn-open-add-kid").onclick = () => {
      exitEditMode();
      openAddKidModal();
    };
    document.getElementById("btn-open-settings").onclick = openSettingsModal;
    document.getElementById("btn-who-loves-me").onclick = openWhoLovesMeModal;
    document.getElementById("btn-cancel-select").onclick = () => {
      state.selectedStampIds.clear();
      renderStampBank();
    };
    document.getElementById("btn-punish-stamps").onclick = openPunishModal;
    document.getElementById("btn-open-redeem-modal").onclick = openRedeemModal;
    document.getElementById("btn-cancel-edit").onclick = exitEditMode;
    document.getElementById("btn-rename-task").onclick = openRenameTaskModal;
    document.getElementById("btn-toggle-task-type").onclick = openToggleTaskTypeModal;
    document.getElementById("btn-restore-punished").onclick = restoreSelectedPunishedStamps;
    document.getElementById("btn-delete-selected").onclick = openConfirmDeleteModal;

    // 集點銀行子頁籤切換
    document.querySelectorAll(".bank-subtab-btn").forEach((btn) => {
      btn.onclick = () => {
        if (state.bankSubTab === btn.dataset.bankTab) return;
        exitEditMode();
        state.selectedStampIds.clear();
        state.bankSubTab = btn.dataset.bankTab;
        renderStampBank();
      };
    });

    // 頁籤切換
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.onclick = () => {
        exitEditMode();
        state.currentTab = btn.dataset.tab;
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
        document.getElementById("tab-tasks").classList.toggle("hidden", state.currentTab !== "tasks");
        document.getElementById("tab-bank").classList.toggle("hidden", state.currentTab !== "bank");
        document.getElementById("tab-history").classList.toggle("hidden", state.currentTab !== "history");
        updateRedeemBar();
      };
    });

    // 日期切換按鈕與左右滑動手勢
    function shiftDate(delta) {
      const target = addDays(state.viewDate, delta);
      if (target > getTodayStr()) return;
      state.viewDate = target;
      renderTaskWall();
    }
    document.getElementById("btn-prev-day").onclick = () => shiftDate(-1);
    document.getElementById("btn-next-day").onclick = () => shiftDate(1);

    let touchStartX = 0, touchStartY = 0;
    const taskTabEl = document.getElementById("tab-tasks");
    taskTabEl.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });
    taskTabEl.addEventListener("touchend", (e) => {
      if (state.editMode) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) shiftDate(-1);
        else shiftDate(1);
      }
    }, { passive: true });

    // === 監聽 Firebase 即時資料 ===
    const CORE_CACHE_KEY = `baby_stamp_core_${FAMILY_KEY}`;
    const DEFAULT_SETTINGS = {
      stampMode: "avatar",
      customStampImage: "",
      selectedCustomStampId: "",
      guardianModes: {},
      lvlThreshold: 50
    };

    // 輕量本機快取（關主、寶貝、設定）
    function saveCoreCache() {
      try {
        localStorage.setItem(CORE_CACHE_KEY, JSON.stringify({
          guardians: state.dbData.guardians,
          kids: state.dbData.kids,
          deletedDemoKids: state.dbData.deletedDemoKids,
          settings: state.dbData.settings
        }));
      } catch (e) {}
    }

    // 大容量本機快取（外框 GIF、自訂圖章，使用 IndexedDB）
    function openMediaDB() {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open(`baby_stamp_media_${FAMILY_KEY}`, 1);
          req.onupgradeneeded = () => {
            if (!req.result.objectStoreNames.contains("kv")) {
              req.result.createObjectStore("kv");
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    }
    async function idbGet(key) {
      const idb = await openMediaDB();
      if (!idb) return null;
      return new Promise((resolve) => {
        try {
          const req = idb.transaction("kv", "readonly").objectStore("kv").get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    }
    async function idbSet(key, val) {
      const idb = await openMediaDB();
      if (!idb) return;
      try {
        idb.transaction("kv", "readwrite").objectStore("kv").put(val, key);
      } catch (e) {}
    }

    // 合併多次監聽觸發，避免同一時間重複渲染畫面
    let renderScheduled = false;
    function scheduleRender() {
      if (renderScheduled) return;
      renderScheduled = true;
      requestAnimationFrame(() => {
        renderScheduled = false;
        renderAll();
      });
    }

    function updateConfirmBtnState() {
      const btn = document.getElementById("btn-confirm-guardian");
      if (!btn) return;
      btn.disabled = !state.coreLoaded;
      btn.textContent = state.coreLoaded ? "確認進入" : "載入寶貝資料中...";
    }

    // 1. 啟動時先讀取本機快取，立即顯示關主畫面
    try {
      const cached = JSON.parse(localStorage.getItem(CORE_CACHE_KEY) || "null");
      if (cached) {
        if (cached.guardians) state.dbData.guardians = cached.guardians;
        if (cached.kids) state.dbData.kids = cached.kids;
        if (cached.deletedDemoKids) state.dbData.deletedDemoKids = cached.deletedDemoKids;
        if (cached.settings) state.dbData.settings = { ...DEFAULT_SETTINGS, ...cached.settings };
        state.coreLoaded = true;
      }
    } catch (e) {}

    updateConfirmBtnState();
    renderAll();

    // 非同步載入本機快取的外框與自訂圖章
    Promise.all([idbGet("customFrames"), idbGet("customStamps")]).then(([frames, stamps]) => {
      let updated = false;
      if (frames && Object.keys(state.dbData.customFrames).length === 0) {
        state.dbData.customFrames = frames;
        updated = true;
      }
      if (stamps && Object.keys(state.dbData.customStamps).length === 0) {
        state.dbData.customStamps = stamps;
        updated = true;
      }
      if (updated) scheduleRender();
    });

    // 2. 分流監聽 Firebase 節點（先載輕量核心，再於背景載入大型外框與圖章）
    const loadedPaths = new Set();
    const corePaths = ["guardians", "kids", "deletedDemoKids", "settings", "tasks", "stamps", "redemptions", "archivedStats"];
    const heavyPaths = ["customStamps", "customFrames"];

    function updateSyncStatus() {
      const el = document.getElementById("sync-status");
      const readyCore = ["guardians", "kids", "deletedDemoKids"].every((k) => loadedPaths.has(k));
      const readyHeavy = heavyPaths.every((k) => loadedPaths.has(k));
      if (readyCore && !state.coreLoaded) {
        state.coreLoaded = true;
        updateConfirmBtnState();
      }
      if (readyCore && readyHeavy) {
        el.textContent = "雲端已即時同步";
      } else if (readyCore) {
        el.textContent = "雲端已同步（背景載入外框中...）";
      }
    }

    function bindNode(key, isHeavy = false) {
      onValue(ref(db, `${ROOT_PATH}/${key}`), (snapshot) => {
        const val = snapshot.val();
        state.dbData[key] = key === "settings"
          ? { ...DEFAULT_SETTINGS, ...(val || {}) }
          : (val || {});

        loadedPaths.add(key);

        if (["guardians", "kids", "deletedDemoKids", "settings"].includes(key)) {
          saveCoreCache();
        } else if (isHeavy) {
          idbSet(key, state.dbData[key]);
        }

        updateSyncStatus();

        // 等印章、兌換紀錄、封存統計與自訂圖章都載入完成，再執行過期清理
        if (["stamps", "redemptions", "archivedStats", "customStamps"].every((k) => loadedPaths.has(k))) {
          cleanupExpiredRedeemedStamps();
        }

        scheduleRender();
      }, (err) => {
        document.getElementById("sync-status").textContent = `連線錯誤：${err.message}`;
      });
    }

    corePaths.forEach((k) => bindNode(k, false));
    heavyPaths.forEach((k) => bindNode(k, true));
  </script>
</body>
</html>
